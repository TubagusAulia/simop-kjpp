---
# ============================================
# Rollback Role — Revert to Previous Release
# ============================================
# Uses Podman image tags to switch between versions
# Usage: ansible-playbook -i hosts.ini site.yml --tags rollback
# ============================================

- name: Get list of Podman images for app
  ansible.builtin.command:
    cmd: podman images --format '{{.Tag}}' simop-app
  register: podman_images
  changed_when: false

- name: Check if there are previous images to rollback to
  ansible.builtin.fail:
    msg: "No previous Podman images found. Cannot rollback."
  when: podman_images.stdout_lines | length < 2

- name: Get current image tag
  ansible.builtin.set_fact:
    current_tag: "{{ podman_images.stdout_lines[0] }}"

- name: Get previous image tag
  ansible.builtin.set_fact:
    previous_tag: "{{ podman_images.stdout_lines[1] }}"

- name: Display rollback info
  ansible.builtin.debug:
    msg: "Rolling back from '{{ current_tag }}' to '{{ previous_tag }}'"

- name: Stop current containers
  ansible.builtin.command:
    cmd: /usr/local/bin/podman-compose down
    chdir: "{{ app_path }}"

- name: Tag current image as rollback backup
  ansible.builtin.command:
    cmd: podman tag simop-app:{{ current_tag }} simop-app:rollback-{{ current_tag }}

- name: Switch to previous image tag in docker-compose.yml
  ansible.builtin.replace:
    path: "{{ app_path }}/docker-compose.yml"
    regexp: '\.\/simop-app:.*'
    replace: "simop-app:{{ previous_tag }}"

- name: Start containers with previous image
  ansible.builtin.command:
    cmd: /usr/local/bin/podman-compose up -d
    chdir: "{{ app_path }}"

- name: Wait for rolled-back app to be healthy
  ansible.builtin.uri:
    url: "http://localhost:{{ app_port }}/"
    status_code: 200
    timeout: 15
  register: health_check
  retries: 15
  delay: 5
  until: health_check.status == 200

- name: Run migrations on rolled-back version
  ansible.builtin.command:
    cmd: /usr/local/bin/podman-compose exec -T app php artisan migrate --force --no-interaction
    chdir: "{{ app_path }}"
  ignore_errors: yes

- name: Print rollback success
  ansible.builtin.debug:
    msg: "✅ Rollback complete. App running on image tag '{{ previous_tag }}'"
