---
# ============================================
# Rollback Role — Revert to Previous Release
# ============================================
# Keeps last N Docker image tags, switches to previous
# Usage: ansible-playbook -i hosts.ini site.yml --tags rollback
# ============================================

- name: Get list of Docker images for app
  ansible.builtin.shell: |
    docker images --format '{{.Tag}}' simop-app | sort -r
  register: docker_images
  changed_when: false

- name: Check if there are previous images to rollback to
  ansible.builtin.fail:
    msg: "No previous Docker images found. Cannot rollback."
  when: docker_images.stdout_lines | length < 2

- name: Get current image tag
  ansible.builtin.set_fact:
    current_tag: "{{ docker_images.stdout_lines[0] }}"

- name: Get previous image tag
  ansible.builtin.set_fact:
    previous_tag: "{{ docker_images.stdout_lines[1] }}"

- name: Display rollback info
  ansible.builtin.debug:
    msg: "Rolling back from '{{ current_tag }}' to '{{ previous_tag }}'"

- name: Stop current containers
  community.docker.docker_compose_v2:
    project_src: "{{ app_path }}"
    state: absent

- name: Update docker-compose to use previous image tag
  ansible.builtin.replace:
    path: "{{ app_path }}/docker-compose.yml"
    regexp: 'dockerfile: Dockerfile'
    replace: "dockerfile: Dockerfile"

- name: Tag current image with previous tag for rollback
  ansible.builtin.shell: |
    docker tag simop-app:{{ current_tag }} simop-app:rollback-{{ current_tag }}

- name: Start containers with previous image
  community.docker.docker_compose_v2:
    project_src: "{{ app_path }}"
    state: present
    services:
      app:
        image: "simop-app:{{ previous_tag }}"

- name: Wait for rolled-back app to be healthy
  ansible.builtin.uri:
    url: "http://localhost:{{ app_port }}/"
    status_code: 200
    timeout: 10
  register: health_check
  retries: 10
  delay: 5
  until: health_check.status == 200

- name: Run migrations on rolled-back version
  community.docker.docker_compose_v2_exec:
    project_src: "{{ app_path }}"
    service: app
    command: php artisan migrate --force --no-interaction
  ignore_errors: yes

- name: Prune old rollback tags (keep last {{ rollback_keep_releases }})
  ansible.builtin.shell: |
    docker images --format '{{.Tag}}' simop-app | grep '^rollback-' | sort -r | tail -n +{{ rollback_keep_releases + 1 }} | xargs -r docker rmi || true
