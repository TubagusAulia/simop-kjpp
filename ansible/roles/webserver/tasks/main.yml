---
# ============================================
# Webserver Role — Install Podman & Dependencies
# ============================================
# Supports: Ubuntu/Debian, AlmaLinux/RHEL/CentOS
# Uses Podman (rootless container runtime) instead of Docker
# Podman is a drop-in replacement for Docker — same Dockerfile &
# docker-compose.yml format, compatible CLI.
# ============================================

- name: Gather OS facts
  ansible.builtin.setup:
    gather_subset:
      - distribution
      - os_family

# ── AlmaLinux / RHEL / CentOS ────────────────

- name: Install Podman (RedHat)
  ansible.builtin.yum:
    name:
      - podman
      - podman-docker    # Provides `docker` → `podman` alias
    state: present
  when: ansible_os_family == "RedHat"

# ── Ubuntu / Debian ──────────────────────────

- name: Install Podman (Debian/Ubuntu)
  ansible.builtin.apt:
    name:
      - podman
      - podman-docker    # Provides `docker` → `podman` alias
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian"

# ── Common ───────────────────────────────────

- name: Install Git
  ansible.builtin.package:
    name: git
    state: present

- name: Install Python3 pip
  ansible.builtin.package:
    name: python3-pip
    state: present

- name: Install podman-compose
  ansible.builtin.pip:
    name:
      - podman-compose     # `podman-compose` CLI for docker-compose.yml support
    state: present
    extra_args: --break-system-packages  # AlmaLinux/RHEL need this for system pip


- name: Ensure app directory exists
  ansible.builtin.file:
    path: "{{ app_path }}"
    state: directory
    mode: '0755'
