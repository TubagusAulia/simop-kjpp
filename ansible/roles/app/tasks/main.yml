---
# ============================================
# App Role — Deploy Laravel App via Podman Compose
# ============================================

- name: Ensure app directory exists
  ansible.builtin.file:
    path: "{{ app_path }}"
    state: directory
    mode: '0755'

- name: Clone or pull latest code
  ansible.builtin.git:
    repo: "{{ git_repo }}"
    dest: "{{ app_path }}"
    version: "{{ git_branch | default('main') }}"
    force: yes
  when: git_repo | length > 0

- name: Copy .env.example to .env (if .env doesn't exist)
  ansible.builtin.copy:
    src: "{{ app_path }}/.env.example"
    dest: "{{ app_path }}/.env"
    remote_src: yes
    force: no

- name: Ensure database directory is writable
  ansible.builtin.file:
    path: "{{ app_path }}/database"
    state: directory
    mode: '0775'
    recurse: yes

- name: Ensure storage directory is writable
  ansible.builtin.file:
    path: "{{ app_path }}/storage"
    state: directory
    mode: '0775'
    recurse: yes

- name: Ensure bootstrap/cache directory is writable
  ansible.builtin.file:
    path: "{{ app_path }}/bootstrap/cache"
    state: directory
    mode: '0775'
    recurse: yes

# ── Podman Compose Deploy ────────────────────

- name: Tear down existing containers (if any)
  ansible.builtin.command:
    cmd: /usr/local/bin/podman-compose down
    chdir: "{{ app_path }}"
  ignore_errors: yes

- name: Build and start containers with /usr/local/bin/podman-compose
  ansible.builtin.command:
    cmd: /usr/local/bin/podman-compose up -d --build
    chdir: "{{ app_path }}"
  register: compose_result

- name: Wait for app to be reachable
  ansible.builtin.uri:
    url: "http://localhost:{{ app_port }}/"
    status_code: 200
    timeout: 15
  register: health_check
  retries: 15
  delay: 5
  until: health_check.status == 200

- name: Run database migrations
  ansible.builtin.command:
    cmd: /usr/local/bin/podman-compose exec -T app php artisan migrate --force --no-interaction
    chdir: "{{ app_path }}"

- name: Cache Laravel configuration
  ansible.builtin.command:
    cmd: /usr/local/bin/podman-compose exec -T app sh -c "php artisan config:cache && php artisan route:cache && php artisan view:cache"
    chdir: "{{ app_path }}"
