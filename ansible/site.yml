---
# ============================================
# SIMOP KJPP — Main Ansible Playbook (Podman)
# ============================================
# Usage:
#   ansible-playbook -i ansible/inventory/hosts.ini ansible/site.yml --extra-vars "git_repo=https://github.com/you/repo.git"
#   ansible-playbook -i ansible/inventory/hosts.ini ansible/site.yml --tags rollback
# ============================================

- name: Deploy SIMOP KJPP Application
  hosts: webserver
  gather_facts: yes
  become: yes

  # git_repo and git_branch are passed via --extra-vars
  # Example: --extra-vars "git_repo=https://github.com/you/repo.git git_branch=main"

  roles:
    - role: webserver
      tags: [webserver]

    - role: app
      tags: [app]

    - role: rollback
      tags: [rollback]
      when: rollback_triggered | default(false)

  post_tasks:
    - name: Verify app is accessible
      ansible.builtin.uri:
        url: "http://localhost:{{ app_port }}/"
        status_code: 200
        timeout: 10
      register: final_check
      retries: 5
      delay: 3
      until: final_check.status == 200

    - name: Print success message
      ansible.builtin.debug:
        msg: "✅ SIMOP KJPP is live at http://{{ inventory_hostname }}:{{ app_port }}/"
