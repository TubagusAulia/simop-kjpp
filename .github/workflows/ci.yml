name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # ── Commit Build (Lightweight) ──────────────────────────────
  # Runs on every push/PR. Fast feedback loop (< 10 min).
  # Pint + PHPStan run in parallel. Tests wait for both.

  code-style:
    name: Code Style (Pint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Laravel Pint (code style check)
        run: vendor/bin/pint --test

  static-analysis:
    name: Static Analysis (PHPStan)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

  # ── Tests ──────────────────────────────────────────────────
  # Runs after Pint + PHPStan pass. PHP 8.3 only.

  tests:
    name: Tests (PHP 8.3)
    runs-on: ubuntu-latest
    needs: [code-style, static-analysis]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Run tests
        run: php artisan test

  # ── Secondary Build (Heavyweight) ──────────────────────────
  # Runs after tests pass. Includes code coverage + SonarCloud.
  # SonarCloud only on push (skipped on PRs), non-blocking.

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: [tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP with coverage
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, xdebug
          coverage: xdebug

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Run tests with coverage
        run: php artisan test --coverage --coverage-text --min=50

      - name: Run tests with Clover XML report
        run: php artisan test --coverage --coverage-clover=coverage.xml --log-junit=test-report.xml

      - name: Run PHPStan (checkstyle report)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M --error-format=checkstyle > phpstan-report.xml || true

      - name: SonarCloud Scan
        if: github.event_name == 'push'
        uses: SonarSource/sonarcloud-github-action@v3
        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORG }}
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.php.coverage.reportPaths=coverage.xml
            -Dsonar.php.tests.reportPath=test-report.xml
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ── Summary Gate ──────────────────────────────────────────────
  # Aggregates all job results into a single "CI" status check.
  # Branch protection rule on `dev` requires this to pass.
  # Does NOT require coverage (SonarCloud is informational).

  CI:
    name: CI
    runs-on: ubuntu-latest
    needs: [code-style, static-analysis, tests]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.code-style.result }}" == "failure" || \
                "${{ needs.static-analysis.result }}" == "failure" || \
                "${{ needs.tests.result }}" == "failure" ]]; then
            echo "❌ One or more CI jobs failed"
            exit 1
          fi
          echo "✅ All CI jobs passed"
