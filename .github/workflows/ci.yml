name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  # ── Commit Build (Lightweight) ──────────────────────────────
  # Runs on every push/PR. Fast feedback loop (< 10 min).
  # Includes: dependency install, code style, static analysis, tests.

  code-style:
    name: Code Style (Pint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Laravel Pint (code style check)
        run: vendor/bin/pint --test

  static-analysis:
    name: Static Analysis (PHPStan)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M || true

  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [8.2, 8.3, 8.4]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Run Unit tests
        run: php artisan test --testsuite=Unit

      - name: Run Feature tests
        run: php artisan test --testsuite=Feature

  # ── Secondary Build (Heavyweight) ──────────────────────────
  # Runs after commit build passes. Includes code coverage.
  # Does not block deployment — informational for now.

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: [code-style, static-analysis, tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP with coverage
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, xdebug
          coverage: xdebug

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Run tests with coverage
        run: php artisan test --coverage --coverage-text --min=50

      - name: Run tests with Clover XML report
        run: php artisan test --coverage --coverage-clover=coverage.xml

      - name: Run PHPStan (checkstyle report)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M --error-format=checkstyle > phpstan-report.xml || true

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3
        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORG }}
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.php.coverage.reportPaths=coverage.xml
            -Dsonar.php.tests.reportPath=test-report.xml
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ── Summary Gate ──────────────────────────────────────────────
  # Aggregates all job results into a single "CI" status check.
  # Branch protection rule on `main` requires this to pass.

  CI:
    name: CI
    runs-on: ubuntu-latest
    needs: [code-style, static-analysis, tests, coverage]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.code-style.result }}" == "failure" || \
                "${{ needs.static-analysis.result }}" == "failure" || \
                "${{ needs.tests.result }}" == "failure" || \
                "${{ needs.coverage.result }}" == "failure" ]]; then
            echo "❌ One or more CI jobs failed"
            exit 1
          fi
          echo "✅ All CI jobs passed"
